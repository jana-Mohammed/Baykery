<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>سلة المشتريات - Bakery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>سلة المشتريات</h1>
        <nav>
            <a href="/">Home</a> | 
            <a href="cart.html">Cart</a> | 
            <a href="#">Register</a>
        </nav>
    </header>

    <main>
        <h2>الطلبات اللي في السلة:</h2>
        
        <div id="cart-items" style="margin-top: 20px;">
            <!-- السلة بتتملي تلقائي هنا -->
        </div>

        <h3 id="total-price" style="color: #8B4513; margin-top: 30px;"></h3>
        
        <button id="clear-cart" class="cart-btn" style="margin: 20px auto; background-color: #dc3545;">
            <i class="fa-solid fa-trash"></i> إفراغ السلة
        </button>
    </main>

    <script>
        // 1. جلب السلة من المتصفح
        let cart = JSON.parse(localStorage.getItem('myCart')) || [];
        const cartContainer = document.getElementById('cart-items');
        const totalElement = document.getElementById('total-price');

        // 2. عرض المنتجات
        if (cart.length === 0) {
            cartContainer.innerHTML = "<p>السلة فاضية حالياً.</p>";
        } else {
            cart.forEach((item, index) => {
                cartContainer.innerHTML += `
                    <div class="cake" style="display: inline-block; margin: 10px;">
                        <h3>${item.name}</h3>
                        <p class="price">${item.price} ريال</p>
                        <button class="cart-btn" style="background-color: #dc3545;" onclick="removeItem(${index})">إزالة</button>
                    </div>
                `;
            });
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            totalElement.textContent = "المجموع الكلي: " + total + " ريال";
        }

        // 3. وظيفة الإزالة
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('myCart', JSON.stringify(cart));
            location.reload(); // تحديث الصفحة
        }

        // 4. إفراغ السلة
        document.getElementById('clear-cart').onclick = () => {
            localStorage.removeItem('myCart');
            location.reload();
        };
    </script>
</body>
</html>
